
name: MediBook - Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe APPLY para confirmar el despliegue'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: medibook-terraform-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Desplegar MediBook en AWS
    if: inputs.confirmacion == 'APPLY'
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticarse en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Inicializar Terraform con S3
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Validar Terraform
        run: terraform validate

      - name: Generar plan de despliegue
        run: terraform plan -out=tfplan

      - name: Ejecutar Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Mostrar recursos desplegados
        run: terraform output
