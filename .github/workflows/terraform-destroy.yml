
name: MediBook - Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe DESTROY para confirmar'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: medibook-terraform-dev
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Eliminar infraestructura MediBook
    if: inputs.confirmacion == 'DESTROY'
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticarse en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Inicializar Terraform con S3
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Validar Terraform
        run: terraform validate

      - name: Generar plan de eliminacion
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Ejecutar Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan

      - name: Confirmar estado final
        run: terraform state list
