
name: MediBook - Pipeline CI/CD Modular

run-name: MediBook ejecutado por ${{ github.actor }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  infraestructura:
    name: Validar infraestructura
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Validar Terraform
        run: |
          echo "Revisar estructura de infraestructura AWS"
          echo "Ejecutar terraform fmt, init y validate"
          echo "Simular terraform plan para VPC, EC2, ALB y RDS"

  seguridad:
    name: Validar seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Verificar seguridad AWS
        run: |
          echo "Revisar permisos IAM"
          echo "Validar autenticacion con Amazon Cognito"
          echo "Revisar reglas de AWS WAF"
          echo "Verificar cifrado KMS y Secrets Manager"
          echo "Comprobar proteccion de credenciales"

  pruebas:
    name: Ejecutar pruebas del sistema
    runs-on: ubuntu-latest
    steps:
      - name: Pruebas de MediBook
        run: |
          echo "Probar API de reservas medicas"
          echo "Verificar que no existan citas duplicadas"
          echo "Comprobar autorizacion de usuarios"
          echo "Simular pruebas de disponibilidad"
          echo "Verificar conexion con PostgreSQL"

  preparacion:
    name: Preparar frontend y backend
    needs: [infraestructura, seguridad, pruebas]
    runs-on: ubuntu-latest
    steps:
      - name: Preparar aplicacion
        run: |
          echo "Preparar frontend para AWS Amplify"
          echo "Preparar backend para Amazon EC2"
          echo "Revisar configuracion del ALB"
          echo "Preparar version anterior para rollback"

  despliegue-pruebas:
    name: Desplegar en pruebas
    needs: [preparacion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Simular despliegue QA
        run: |
          echo "Simular despliegue en entorno de pruebas"
          echo "Aplicar infraestructura Terraform en QA"
          echo "Publicar frontend en Amplify de pruebas"
          echo "Actualizar backend EC2 de pruebas"
          echo "Verificar funcionamiento de MediBook"

  despliegue-produccion:
    name: Desplegar en produccion
    needs: [preparacion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Simular despliegue AWS
        run: |
          echo "Simular despliegue controlado en produccion"
          echo "Revisar cambios con terraform plan"
          echo "Publicar frontend en AWS Amplify"
          echo "Actualizar backend en EC2 Auto Scaling"
          echo "Verificar salud de instancias mediante ALB"
          echo "Conservar version anterior para rollback"

  monitoreo:
    name: Monitoreo y recuperacion
    needs: [despliegue-pruebas, despliegue-produccion]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      github.event_name == 'push' &&
      (needs.despliegue-pruebas.result == 'success' ||
       needs.despliegue-produccion.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Supervisar MediBook
        run: |
          echo "Monitorear servicios con Amazon CloudWatch"
          echo "Revisar errores HTTP 5xx y latencia"
          echo "Verificar disponibilidad de EC2 y RDS"
          echo "Simular alertas mediante Amazon SNS"
          echo "Planificar rollback ante posibles fallas"
          echo "Pipeline modular MediBook finalizado"
